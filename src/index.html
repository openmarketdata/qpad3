<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Q Webpack Example</title>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { height: 100%; overflow: hidden; background: #1e1e1e; color: #ccc; font-family: sans-serif; }
            .wrapper {
                display: flex;
                height: 100%;
                width: 100%;
            }
            .one {
                flex: 0 0 420px;
                min-width: 200px;
                display: flex;
                flex-direction: column;
                border-right: 1px solid #3c3c3c;
                background: #282c34;
            }
            #editor-container {
                flex: 1 1 auto;
                overflow: hidden;
            }
            #editor-container .cm-editor {
                height: 100%;
            }
            .two {
                flex: 1 1 auto;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .tab-bar {
                display: flex;
                flex: 0 0 auto;
                background: #21252b;
                border-bottom: 1px solid #3c3c3c;
            }
            .tab-bar .tab {
                padding: 6px 16px;
                cursor: pointer;
                color: #6b717d;
                font-size: 12px;
                font-family: sans-serif;
                border-bottom: 2px solid transparent;
                user-select: none;
            }
            .tab-bar .tab:hover {
                color: #abb2bf;
            }
            .tab-bar .tab.tab-active {
                color: #e5c07b;
                border-bottom-color: #e5c07b;
            }
            #viewer-container {
                flex: 1 1 auto;
                overflow: hidden;
            }
            #viewer-container .cm-editor {
                height: 100%;
            }
            #grid-container {
                flex: 1 1 auto;
                overflow: hidden;
                display: none;
            }
            #grid-container perspective-viewer {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="one">
                <div id="editor-container"></div>
            </div>
            <div class="two">
                <div class="tab-bar">
                    <div class="tab tab-active" data-tab="repl">REPL</div>
                    <div class="tab" data-tab="grid">Grid</div>
                </div>
                <div id="viewer-container"></div>
                <div id="grid-container"></div>
            </div>
        </div>
    </body>
</html>
