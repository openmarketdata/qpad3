<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Q Webpack Example</title>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { height: 100%; overflow: hidden; background: #1e1e1e; color: #ccc; font-family: sans-serif; }
            .wrapper {
                display: flex;
                height: 100%;
                width: 100%;
            }
            /* Collapsible control-menu icon rail */
            .sidebar {
                flex: 0 0 44px;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 6px;
                gap: 4px;
                background: #21252b;
                border-right: 1px solid #3c3c3c;
            }
            .sidebar .side-btn {
                width: 34px;
                height: 34px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #6b717d;
                cursor: pointer;
                border-radius: 5px;
                border-left: 2px solid transparent;
            }
            .sidebar .side-btn:hover { color: #abb2bf; background: #2c313a; }
            .sidebar .side-btn.active { color: #e5c07b; background: #2c313a; }
            .sidebar .side-btn svg { width: 20px; height: 20px; }
            /* File explorer panel (toggled by the sidebar) */
            .fx-panel {
                flex: 0 0 260px;
                display: none;
                flex-direction: column;
                background: #252932;
                border-right: 1px solid #3c3c3c;
                overflow: hidden;
            }
            .fx-panel.open { display: flex; }
            .fx-header {
                flex: 0 0 auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 10px;
                font-size: 11px;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                color: #8b93a1;
                border-bottom: 1px solid #3c3c3c;
            }
            .fx-header .fx-refresh {
                cursor: pointer;
                color: #6b717d;
                font-size: 14px;
            }
            .fx-header .fx-refresh:hover { color: #abb2bf; }
            .fx-path {
                flex: 0 0 auto;
                padding: 4px 10px;
                font-size: 11px;
                color: #6b717d;
                font-family: monospace;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .fx-list {
                flex: 1 1 auto;
                overflow-y: auto;
                padding: 2px 0;
            }
            .fx-item {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 3px 10px;
                font-size: 13px;
                color: #abb2bf;
                cursor: pointer;
                user-select: none;
                white-space: nowrap;
            }
            .fx-item:hover { background: #2c313a; }
            .fx-item.dir { color: #61afef; }
            .fx-item .fx-icon { width: 14px; text-align: center; flex: 0 0 auto; }
            .fx-item .fx-size { margin-left: auto; color: #4b515d; font-size: 11px; }
            .one {
                flex: 1 1 auto;
                min-width: 360px;
                display: flex;
                flex-direction: column;
                border-right: 1px solid #3c3c3c;
                background: #282c34;
            }
            .editor-toolbar {
                flex: 0 0 auto;
                height: 34px;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 10px;
                background: #21252b;
                border-bottom: 1px solid #3c3c3c;
                font-size: 12px;
            }
            .editor-toolbar .et-file {
                color: #8b93a1;
                font-family: monospace;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1 1 auto;
            }
            .editor-toolbar .et-file .dirty { color: #e5c07b; }
            .editor-toolbar button {
                background: #2c313a;
                color: #abb2bf;
                border: 1px solid #3c3c3c;
                border-radius: 4px;
                padding: 3px 10px;
                font-size: 12px;
                cursor: pointer;
            }
            .editor-toolbar button:hover:not(:disabled) { background: #3a414d; color: #fff; }
            .editor-toolbar button:disabled { opacity: 0.4; cursor: default; }
            #editor-container {
                flex: 1 1 auto;
                overflow: hidden;
            }
            #editor-container .cm-editor {
                height: 100%;
            }
            .two {
                flex: 1 1 560px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .tab-bar {
                display: flex;
                flex: 0 0 auto;
                height: 34px;
                align-items: stretch;
                background: #21252b;
                border-bottom: 1px solid #3c3c3c;
            }
            .tab-bar .tab {
                display: flex;
                align-items: center;
                padding: 0 16px;
                cursor: pointer;
                color: #6b717d;
                font-size: 12px;
                font-family: sans-serif;
                border-bottom: 2px solid transparent;
                user-select: none;
            }
            .tab-bar .tab:hover {
                color: #abb2bf;
            }
            .tab-bar .tab.tab-active {
                color: #e5c07b;
                border-bottom-color: #e5c07b;
            }
            #viewer-container {
                flex: 1 1 auto;
                overflow: hidden;
            }
            #viewer-container .cm-editor {
                height: 100%;
            }
            #grid-container {
                flex: 1 1 auto;
                overflow: hidden;
                display: none;
            }
            #grid-container perspective-viewer {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="sidebar">
                <div class="side-btn" id="btn-files" title="File explorer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                </div>
            </div>
            <div class="fx-panel" id="fx-panel">
                <div class="fx-header">
                    <span>EXPR</span>
                    <span class="fx-refresh" id="fx-refresh" title="Refresh">&#x21bb;</span>
                </div>
                <div class="fx-path" id="fx-path">/</div>
                <div class="fx-list" id="fx-list"></div>
            </div>
            <div class="one">
                <div class="editor-toolbar">
                    <span class="et-file" id="et-file">untitled</span>
                    <button id="et-new" title="New file">New</button>
                    <button id="et-save" title="Save file" disabled>Save</button>
                </div>
                <div id="editor-container"></div>
            </div>
            <div class="two">
                <div class="tab-bar">
                    <div class="tab tab-active" data-tab="repl">REPL</div>
                    <div class="tab" data-tab="grid">GRID</div>
                </div>
                <div id="viewer-container"></div>
                <div id="grid-container"></div>
            </div>
        </div>
    </body>
</html>
